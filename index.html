<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>スマブラSP サムネイルジェネレーター ver1.5.0</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=Nunito+Sans:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <script src="sketch.js" defer></script>
  </head>
  <body>
    <header>
      <h1>SSBU thumbnail generator <span class="version">ver.1.5.0</span></h1>
    </header>

    <main>
      <section id="controls">

        <!-- 常に表示する操作ボタン -->
        <div class="action-bar">
          <button id="exportBtn" class="export-btn">PNG書き出し</button>
          <button id="swapBtn" class="swap-btn" title="1Pと2Pの入力内容を入れ替えます">1P ⇄ 2P</button>
          <div class="bg-buttons">
            <button id="mainBtn" class="mode-btn mode-main active">本戦用</button>
            <button id="preBtn" class="mode-btn mode-pre">予選用</button>
          </div>
          <p id="status" class="status" aria-live="polite"></p>
        </div>

        <!-- タブ切り替えボタン -->
        <div class="tab-buttons" role="tablist">
          <button class="tab-btn active" role="tab" data-tab="p1Box">1P 設定</button>
          <button class="tab-btn" role="tab" data-tab="p2Box">2P 設定</button>
          <button class="tab-btn" role="tab" data-tab="matchBox">大会情報</button>
        </div>

        <!-- 3つのパネルは同じ場所に重ねて置き、タブを切り替えても高さが変わらないようにする -->
        <div class="tab-panels">

        <!-- 1Pの設定パネル (初期状態では active) -->
        <div id="p1Box" class="player-box tab-panel active" role="tabpanel">
          <div class="row">
            <div class="field grow">
              <label for="p1Char">メインファイター</label>
              <input id="p1Char" type="text" value="lucas" list="character-suggestions" autocomplete="off" />
            </div>
            <div class="field color">
              <label for="p1Color">カラー</label>
              <input id="p1Color" type="number" inputmode="numeric" class="color-input" value="1" />
            </div>
          </div>

          <div class="row sub">
            <div class="field grow">
              <label for="p1Icon1">↳ ストックアイコン①</label>
              <input id="p1Icon1" type="text" value="" list="character-suggestions" placeholder="例: mario" autocomplete="off" />
            </div>
            <div class="field color">
              <label for="p1Icon1Color">カラー</label>
              <input id="p1Icon1Color" type="number" inputmode="numeric" class="color-input" value="1" />
            </div>
          </div>

          <div class="row sub">
            <div class="field grow">
              <label for="p1Icon2">↳ ストックアイコン②</label>
              <input id="p1Icon2" type="text" value="" list="character-suggestions" placeholder="例: luigi" autocomplete="off" />
            </div>
            <div class="field color">
              <label for="p1Icon2Color">カラー</label>
              <input id="p1Icon2Color" type="number" inputmode="numeric" class="color-input" value="1" />
            </div>
          </div>

          <label for="p1Name">プレイヤー名</label>
          <input id="p1Name" type="text" value="ほむら" />
          <label for="p1Team">チーム名</label>
          <input id="p1Team" type="text" value="炎メシ" />

          <div class="sliders">
            <label for="scaleSlider1">倍率 <output id="scaleSlider1Val"></output></label>
            <input id="scaleSlider1" type="range" min="0.1" max="5.0" step="0.01" value="1" />
            <label for="xOffsetSlider1">横オフセット <output id="xOffsetSlider1Val"></output></label>
            <input id="xOffsetSlider1" type="range" min="-1000" max="1000" step="1" value="0" />
            <label for="yOffsetSlider1">縦オフセット <output id="yOffsetSlider1Val"></output></label>
            <input id="yOffsetSlider1" type="range" min="-1000" max="1000" step="1" value="0" />
            <button class="reset-btn" data-player="1">位置・倍率をリセット</button>
          </div>
        </div>

        <!-- 2Pの設定パネル -->
        <div id="p2Box" class="player-box tab-panel" role="tabpanel">
          <div class="row">
            <div class="field grow">
              <label for="p2Char">メインファイター</label>
              <input id="p2Char" type="text" value="steve" list="character-suggestions" autocomplete="off" />
            </div>
            <div class="field color">
              <label for="p2Color">カラー</label>
              <input id="p2Color" type="number" inputmode="numeric" class="color-input" value="1" />
            </div>
          </div>

          <div class="row sub">
            <div class="field grow">
              <label for="p2Icon1">↳ ストックアイコン①</label>
              <input id="p2Icon1" type="text" value="" list="character-suggestions" placeholder="例: steve" autocomplete="off" />
            </div>
            <div class="field color">
              <label for="p2Icon1Color">カラー</label>
              <input id="p2Icon1Color" type="number" inputmode="numeric" class="color-input" value="1" />
            </div>
          </div>

          <div class="row sub">
            <div class="field grow">
              <label for="p2Icon2">↳ ストックアイコン②</label>
              <input id="p2Icon2" type="text" value="" list="character-suggestions" placeholder="例: sora" autocomplete="off" />
            </div>
            <div class="field color">
              <label for="p2Icon2Color">カラー</label>
              <input id="p2Icon2Color" type="number" inputmode="numeric" class="color-input" value="1" />
            </div>
          </div>

          <label for="p2Name">プレイヤー名</label>
          <input id="p2Name" type="text" value="HOMURA" />
          <label for="p2Team">チーム名</label>
          <input id="p2Team" type="text" value="Homurameshi" />

          <div class="sliders">
            <label for="scaleSlider2">倍率 <output id="scaleSlider2Val"></output></label>
            <input id="scaleSlider2" type="range" min="0.1" max="5.0" step="0.01" value="1" />
            <label for="xOffsetSlider2">横オフセット <output id="xOffsetSlider2Val"></output></label>
            <input id="xOffsetSlider2" type="range" min="-1000" max="1000" step="1" value="0" />
            <label for="yOffsetSlider2">縦オフセット <output id="yOffsetSlider2Val"></output></label>
            <input id="yOffsetSlider2" type="range" min="-1000" max="1000" step="1" value="0" />
            <button class="reset-btn" data-player="2">位置・倍率をリセット</button>
          </div>
        </div>

        <!-- 大会情報パネル -->
        <div id="matchBox" class="match-box tab-panel" role="tabpanel">
          <label for="matchNum">開催回</label>
          <input id="matchNum" type="text" value="SAITAMA SMASH AYA #3" />
          <label for="round">ラウンド</label>
          <input id="round" type="text" value="WINNERS ROUND 4" list="round-suggestions" />
          <label for="date">日付</label>
          <input id="date" type="text" value="2025/10/14" />
          <button id="todayBtn" class="sub-btn">今日の日付を入れる</button>
        </div>

        </div>

        <button id="clearBtn" class="clear-btn">入力内容を初期状態に戻す</button>
      </section>

      <section id="canvas-container"></section>
    </main>

    <datalist id="round-suggestions">
      <option value="WINNERS ROUND 1"></option>
      <option value="WINNERS ROUND 2"></option>
      <option value="WINNERS ROUND 3"></option>
      <option value="WINNERS QUARTER FINAL"></option>
      <option value="WINNERS SEMI FINAL"></option>
      <option value="WINNERS FINAL"></option>
      <option value="LOSERS ROUND 1"></option>
      <option value="LOSERS ROUND 2"></option>
      <option value="LOSERS ROUND 3"></option>
      <option value="LOSERS QUARTER FINAL"></option>
      <option value="LOSERS SEMI FINAL"></option>
      <option value="LOSERS FINAL"></option>
      <option value="GRAND FINAL"></option>
      <option value="GRAND FINAL RESET"></option>
      <option value="POOLS"></option>
    </datalist>

    <!-- タブ切り替え用のスクリプト -->
    <script>
      document.querySelectorAll(".tab-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".tab-panel").forEach((panel) => panel.classList.remove("active"));
          document.querySelectorAll(".tab-btn").forEach((b) => b.classList.remove("active"));

          document.getElementById(btn.dataset.tab).classList.add("active");
          btn.classList.add("active");
        });
      });
    </script>
  </body>
</html>
